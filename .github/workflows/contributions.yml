name: Refresh contribution artwork

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contribution-artwork
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render the public GitHub calendar
        run: python3 scripts/update-contributions.py
      - name: Commit artwork if it changed
        run: |
          git add assets/contributions.svg assets/contributions-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh contribution artwork [skip ci]"
          git push
