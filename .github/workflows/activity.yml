name: Refresh profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-activity.py
      - scripts/update-leetcode.py
      - scripts/update-monkeytype.py
      - scripts/update-hackerrank.py
      - scripts/build-profile.cjs
      - scripts/lib/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: git-activity-artwork
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the public GitHub calendar
        run: python3 scripts/update-activity.py
      - name: Refresh verified LeetCode stats
        run: |
          python3 scripts/update-leetcode.py
      - name: Refresh public Monkeytype stats
        run: python3 scripts/update-monkeytype.py
      - name: Refresh public HackerRank stats
        continue-on-error: true
        run: python3 scripts/update-hackerrank.py
      - name: Render themed profile cards
        run: node scripts/build-profile.cjs --stats-only
      - name: Commit statistics changes
        run: |
          git add assets/data/ assets/activity*.svg assets/consistency*.svg assets/leetcode*.svg assets/monkeytype*.svg assets/hackerrank*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile statistics [skip ci]"
          git push
