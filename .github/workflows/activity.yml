name: Refresh Git activity graph

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update-activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: git-activity-artwork
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render activity from the public GitHub calendar
        run: python3 scripts/update-activity.py
      - name: Commit graph changes
        run: |
          git add assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Git activity graph [skip ci]"
          git push
